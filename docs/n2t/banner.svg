<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 300" width="1120" height="300" role="img" aria-label="n2t Code — an unofficial fork based on the T3 Code source code">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1017"/>
      <stop offset="55%" stop-color="#0e1520"/>
      <stop offset="100%" stop-color="#0a1219"/>
    </linearGradient>
    <radialGradient id="tealGlow" cx="0.22" cy="0.45" r="0.45">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amberGlow" cx="0.88" cy="0.25" r="0.42">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="markStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" fill-opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Solid frame for light and dark GitHub themes -->
  <rect x="1" y="1" width="1118" height="298" rx="18" fill="url(#bgGrad)" stroke="#243144" stroke-width="1.5"/>
  <rect x="2" y="2" width="1116" height="296" rx="17" fill="url(#dotGrid)"/>
  <rect x="2" y="2" width="1116" height="296" rx="17" fill="url(#tealGlow)"/>
  <rect x="2" y="2" width="1116" height="296" rx="17" fill="url(#amberGlow)"/>

  <!-- Original n2t geometric emblem -->
  <g transform="translate(56, 72)">
    <rect x="0" y="0" width="156" height="156" rx="30" fill="#101926" stroke="#26384f" stroke-width="1.5"/>
    <rect x="8" y="8" width="140" height="140" rx="24" fill="#0c131d" stroke="#1b2a3d" stroke-width="1"/>
    <!-- Left lane ("n" stem + arch) -->
    <path d="M 42 114 L 42 54 C 42 42, 62 42, 68 54 L 88 94 C 94 106, 114 106, 114 94 L 114 44"
          fill="none" stroke="url(#markStroke)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Secondary fork rail -->
    <path d="M 42 78 L 62 78" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
    <path d="M 94 64 L 114 64" fill="none" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
    <!-- Terminal nodes -->
    <circle cx="42" cy="114" r="7" fill="#5eead4"/>
    <circle cx="114" cy="44" r="7" fill="#f59e0b"/>
    <circle cx="78" cy="74" r="5" fill="#0c131d" stroke="#5eead4" stroke-width="3"/>
  </g>

  <!-- Title & unofficial fork notice -->
  <g transform="translate(248, 66)">
    <rect x="0" y="0" width="252" height="26" rx="13" fill="#0f292b" stroke="#1f5858" stroke-width="1"/>
    <circle cx="14" cy="13" r="4" fill="#2dd4bf"/>
    <text x="26" y="17" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="0.7" fill="#99f6e4">UNOFFICIAL FORK · MIT SOURCE</text>

    <text x="0" y="86" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="56" font-weight="750" letter-spacing="-1.6" fill="#f8fafc">n2t <tspan fill="url(#accentGrad)">Code</tspan></text>

    <text x="2" y="122" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#94a3b8">Personal control plane for coding agents — based on T3 Code source.</text>

    <!-- Feature pills -->
    <g transform="translate(0, 146)" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500">
      <rect x="0" y="0" width="128" height="28" rx="14" fill="#131c28" stroke="#263448" stroke-width="1"/>
      <circle cx="15" cy="14" r="3.5" fill="#2dd4bf"/>
      <text x="26" y="18.5" fill="#cbd5e1">Recent threads</text>

      <rect x="138" y="0" width="166" height="28" rx="14" fill="#131c28" stroke="#263448" stroke-width="1"/>
      <circle cx="153" cy="14" r="3.5" fill="#38bdf8"/>
      <text x="164" y="18.5" fill="#cbd5e1">Snippets + PR search</text>

      <rect x="314" y="0" width="154" height="28" rx="14" fill="#131c28" stroke="#263448" stroke-width="1"/>
      <circle cx="329" cy="14" r="3.5" fill="#f59e0b"/>
      <text x="340" y="18.5" fill="#cbd5e1">In-app fork updater</text>
    </g>
  </g>

  <!-- Right side decorative status card -->
  <g transform="translate(808, 48)">
    <rect x="0" y="0" width="264" height="204" rx="14" fill="#0f1723" stroke="#233246" stroke-width="1.2"/>
    <rect x="0" y="0" width="264" height="34" rx="14" fill="#141f2e"/>
    <rect x="0" y="20" width="264" height="14" fill="#141f2e"/>
    <line x1="0" y1="34" x2="264" y2="34" stroke="#233246" stroke-width="1"/>
    <circle cx="18" cy="17" r="4" fill="#334155"/>
    <circle cx="32" cy="17" r="4" fill="#334155"/>
    <circle cx="46" cy="17" r="4" fill="#334155"/>
    <text x="248" y="21" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#64748b">branch: custom</text>

    <!-- Stylized active agent rows -->
    <g transform="translate(16, 48)" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
      <rect x="0" y="0" width="232" height="36" rx="8" fill="#13262b" stroke="#1d4d4d" stroke-width="1"/>
      <circle cx="15" cy="18" r="4" fill="#2dd4bf"/>
      <text x="28" y="16" font-size="12" font-weight="600" fill="#e2e8f0">Claude · Codex · ACP</text>
      <text x="28" y="29" font-size="10.5" fill="#94a3b8">Local agents, one interface</text>

      <rect x="0" y="46" width="232" height="36" rx="8" fill="#131c28" stroke="#233246" stroke-width="1"/>
      <circle cx="15" cy="64" r="4" fill="#38bdf8"/>
      <text x="28" y="62" font-size="12" font-weight="600" fill="#e2e8f0">Council review · PR #412</text>
      <text x="28" y="75" font-size="10.5" fill="#94a3b8">Snippet slot → project thread</text>

      <rect x="0" y="92" width="232" height="44" rx="8" fill="#131c28" stroke="#233246" stroke-width="1"/>
      <circle cx="15" cy="114" r="4" fill="#f59e0b"/>
      <text x="28" y="110" font-size="11.5" font-weight="600" fill="#e2e8f0">upstream/main sync</text>
      <text x="28" y="125" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" fill="#94a3b8">scripts/fork/update.sh</text>
    </g>
  </g>
</svg>
