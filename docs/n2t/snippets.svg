<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" width="1120" height="470" role="img" aria-label="Snippets panel with structured prompt slots and live pull request search dialog">
  <defs>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111926"/>
      <stop offset="100%" stop-color="#0d131d"/>
    </linearGradient>
  </defs>

  <!-- Solid outer canvas -->
  <rect x="1" y="1" width="1118" height="468" rx="16" fill="#0b1017" stroke="#243144" stroke-width="1.5"/>

  <!-- Section header -->
  <text x="32" y="40" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">Snippets &amp; pull request search</text>
  <text x="32" y="63" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#94a3b8">Run saved prompts as side chats or new threads with per-snippet models and interactive {{pr}} / {{notes}} slots.</text>

  <!-- LEFT: Snippets panel -->
  <g transform="translate(32, 86)">
    <rect x="0" y="0" width="474" height="354" rx="12" fill="url(#cardGrad)" stroke="#243144" stroke-width="1.2"/>

    <!-- Top bar: tabs + New snippet -->
    <g transform="translate(14, 12)" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
      <rect x="0" y="0" width="82" height="26" rx="7" fill="#172435" stroke="#2b3f59" stroke-width="1"/>
      <text x="41" y="17" text-anchor="middle" font-size="12" font-weight="600" fill="#f8fafc">Snippets</text>
      <text x="130" y="17" text-anchor="middle" font-size="12" fill="#64748b">Linked items</text>

      <rect x="342" y="0" width="104" height="26" rx="7" fill="#0f1722" stroke="#2a3a52" stroke-width="1"/>
      <text x="394" y="17" text-anchor="middle" font-size="11.5" font-weight="500" fill="#cbd5e1">+ New snippet</text>
    </g>
    <line x1="0" y1="48" x2="474" y2="48" stroke="#1e2a3b" stroke-width="1"/>

    <!-- Grouped snippet list -->
    <rect x="14" y="62" width="446" height="276" rx="10" fill="#0c121b" stroke="#223042" stroke-width="1"/>

    <!-- Snippet 1: My Linear tickets -->
    <g transform="translate(26, 76)" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
      <rect x="0" y="2" width="32" height="32" rx="8" fill="#182232"/>
      <!-- Lightning icon -->
      <path d="M 18 9 L 11 19 L 16 19 L 14 27 L 21 17 L 16 17 Z" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linejoin="round"/>

      <text x="44" y="16" font-size="13.5" font-weight="600" fill="#f1f5f9">My Linear tickets</text>
      <text x="44" y="36" font-size="12" fill="#94a3b8">Use Linear to list every issue assigned to me that is not</text>
      <text x="44" y="53" font-size="12" fill="#64748b">Done, Canceled, or Duplicate. Group by state…</text>

      <!-- Controls -->
      <rect x="44" y="68" width="128" height="26" rx="6" fill="#141d2b" stroke="#263448" stroke-width="1"/>
      <text x="54" y="85" font-size="11.5" fill="#94a3b8">Thread model  ▾</text>

      <rect x="348" y="68" width="72" height="26" rx="6" fill="#182538" stroke="#2d415c" stroke-width="1"/>
      <path d="M 364 77 L 371 81 L 364 85 Z" fill="#cbd5e1"/>
      <text x="377" y="85" font-size="11.5" font-weight="600" fill="#e2e8f0">Run</text>
    </g>

    <line x1="14" y1="190" x2="460" y2="190" stroke="#1e2a3b" stroke-width="1"/>

    <!-- Snippet 2: Council review (hover/active) -->
    <path d="M 15 191 H 459 V 328 Q 459 337 450 337 H 24 Q 15 337 15 328 Z" fill="#121d2b"/>
    <g transform="translate(26, 206)" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
      <rect x="0" y="2" width="32" height="32" rx="8" fill="#102b2d" stroke="#1d4d4d" stroke-width="1"/>
      <!-- Pull request icon -->
      <circle cx="12" cy="12" r="2.6" fill="none" stroke="#5eead4" stroke-width="1.5"/>
      <circle cx="12" cy="24" r="2.6" fill="none" stroke="#5eead4" stroke-width="1.5"/>
      <circle cx="21" cy="24" r="2.6" fill="none" stroke="#5eead4" stroke-width="1.5"/>
      <line x1="12" y1="14.6" x2="12" y2="21.4" stroke="#5eead4" stroke-width="1.5"/>
      <path d="M 17 12 L 21 12 L 21 21.4" fill="none" stroke="#5eead4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

      <text x="44" y="16" font-size="13.5" font-weight="600" fill="#f8fafc">Council review</text>

      <!-- Hover edit/delete buttons -->
      <rect x="372" y="0" width="22" height="22" rx="5" fill="#1b283a"/>
      <path d="M 379 15 L 386 8 M 384 7 L 387 10" stroke="#94a3b8" stroke-width="1.4" stroke-linecap="round"/>
      <rect x="398" y="0" width="22" height="22" rx="5" fill="#2a1920"/>
      <path d="M 405 8 L 413 8 M 406.5 8 L 407 15 L 411 15 L 411.5 8" fill="none" stroke="#f87171" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Prompt with visual slot badges instead of raw placeholders -->
      <text x="44" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" fill="#cbd5e1">/council opus neon4 gpt6.2sol</text>
      <rect x="260" y="27" width="44" height="20" rx="5" fill="#0f2d2e" stroke="#2dd4bf" stroke-width="1"/>
      <text x="282" y="41" text-anchor="middle" font-size="10.5" font-weight="600" fill="#5eead4">PR</text>

      <rect x="44" y="53" width="54" height="20" rx="5" fill="#2b2111" stroke="#d97706" stroke-width="1"/>
      <text x="71" y="67" text-anchor="middle" font-size="10.5" font-weight="600" fill="#fbbf24">Notes</text>

      <!-- Controls -->
      <rect x="44" y="88" width="128" height="26" rx="6" fill="#141d2b" stroke="#263448" stroke-width="1"/>
      <text x="54" y="105" font-size="11.5" fill="#cbd5e1">Claude Opus  ▾</text>

      <rect x="342" y="88" width="78" height="26" rx="6" fill="#133d3c" stroke="#2dd4bf" stroke-width="1.2"/>
      <path d="M 356 97 L 363 101 L 356 105 Z" fill="#99f6e4"/>
      <text x="369" y="105" font-size="11.5" font-weight="650" fill="#f0fdfa">Run…</text>
    </g>
  </g>

  <!-- Connector arrow from Run… to Dialog -->
  <g transform="translate(506, 392)">
    <path d="M 0 0 L 58 0" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="4 4"/>
    <path d="M 52 -6 L 62 0 L 52 6" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- RIGHT: Run dialog with live PR search -->
  <g transform="translate(574, 86)">
    <rect x="0" y="0" width="514" height="354" rx="12" fill="#121a26" stroke="#2d415c" stroke-width="1.4"/>

    <!-- Dialog title bar -->
    <text x="20" y="29" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Run Council review</text>
    <text x="494" y="28" text-anchor="end" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#64748b">×</text>
    <line x1="0" y1="44" x2="514" y2="44" stroke="#1e2a3b" stroke-width="1"/>

    <!-- Live PR Search box -->
    <g transform="translate(20, 58)">
      <text x="0" y="10" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#94a3b8">Pull request</text>
      <rect x="0" y="18" width="474" height="34" rx="8" fill="#0b1017" stroke="#2dd4bf" stroke-width="1.3"/>
      <circle cx="16" cy="34" r="5" fill="none" stroke="#5eead4" stroke-width="1.6"/>
      <line x1="20" y1="38" x2="23.5" y2="41.5" stroke="#5eead4" stroke-width="1.6" stroke-linecap="round"/>
      <text x="32" y="39" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#f8fafc">sidebar</text>
      <rect x="81" y="27" width="1.5" height="16" fill="#2dd4bf"/>

      <rect x="330" y="24" width="136" height="22" rx="11" fill="#0f292b" stroke="#1d4d4d" stroke-width="1"/>
      <text x="398" y="39" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" fill="#99f6e4">Host search · 250ms</text>
    </g>

    <!-- Open PR results -->
    <g transform="translate(20, 120)" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
      <rect x="0" y="0" width="474" height="114" rx="8" fill="#0c121b" stroke="#223042" stroke-width="1"/>

      <!-- Result 1 (selected) -->
      <rect x="4" y="4" width="466" height="34" rx="6" fill="#112b2e" stroke="#1e5757" stroke-width="1"/>
      <circle cx="18" cy="21" r="3.5" fill="#2dd4bf"/>
      <text x="31" y="25" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600" fill="#5eead4">#412</text>
      <text x="72" y="25" font-size="12.5" font-weight="600" fill="#f8fafc">Recent threads flat list in boring sidebar</text>
      <text x="456" y="25" text-anchor="end" font-size="11" fill="#5eead4">✓</text>

      <!-- Result 2 -->
      <circle cx="18" cy="57" r="3.5" fill="#22c55e"/>
      <text x="31" y="61" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" fill="#94a3b8">#398</text>
      <text x="72" y="61" font-size="12.5" fill="#cbd5e1">Keep sidebar header toggle label stable</text>
      <text x="456" y="61" text-anchor="end" font-size="11" fill="#64748b">n2t-code</text>

      <!-- Result 3 -->
      <circle cx="18" cy="93" r="3.5" fill="#22c55e"/>
      <text x="31" y="97" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" fill="#94a3b8">#381</text>
      <text x="72" y="97" font-size="12.5" fill="#94a3b8">Show fork update progress ring in sidebar</text>
      <text x="456" y="97" text-anchor="end" font-size="11" fill="#64748b">n2t-code</text>
    </g>

    <!-- Notes field -->
    <g transform="translate(20, 248)" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="0" y="10" font-size="11.5" font-weight="600" fill="#94a3b8">Notes (optional)</text>
      <rect x="0" y="18" width="474" height="36" rx="8" fill="#0b1017" stroke="#243144" stroke-width="1"/>
      <text x="12" y="40" font-size="12.5" fill="#cbd5e1">Check keyboard focus behavior and aria-pressed semantics</text>
    </g>

    <!-- Dialog footer -->
    <line x1="0" y1="312" x2="514" y2="312" stroke="#1e2a3b" stroke-width="1"/>
    <text x="20" y="337" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#94a3b8">Starts thread in project: <tspan font-weight="600" fill="#e2e8f0">n2t-code</tspan></text>

    <rect x="342" y="321" width="62" height="24" rx="6" fill="#182232" stroke="#28374d" stroke-width="1"/>
    <text x="373" y="337" text-anchor="middle" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#94a3b8">Cancel</text>

    <rect x="412" y="321" width="82" height="24" rx="6" fill="#14b8a6"/>
    <text x="453" y="337" text-anchor="middle" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="650" fill="#042f2e">Run snippet</text>
  </g>
</svg>
