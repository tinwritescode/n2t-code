<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="n2t Code favicon">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#142133"/>
      <stop offset="100%" stop-color="#080e17"/>
    </linearGradient>
    <radialGradient id="tealGlow" cx="0.35" cy="0.6" r="0.55">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="markStroke" x1="7.5" y1="24" x2="24.5" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="55%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Rounded square tile with crisp border for light and dark browser tabs -->
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="7" fill="url(#bgGrad)" stroke="#2f4560" stroke-width="1.5"/>
  <rect x="1.5" y="1.5" width="29" height="29" rx="6.25" fill="url(#tealGlow)"/>

  <!-- Simplified, thicker n2t routing mark tuned for 16px and 32px legibility -->
  <path d="M 19.3 13 L 24.5 13"
        fill="none" stroke="#f59e0b" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M 7.5 19.5 L 12.2 19.5"
        fill="none" stroke="#38bdf8" stroke-width="2.4" stroke-linecap="round"/>

  <path d="M 7.5 23.5 L 7.5 11.5 C 7.5 7.5, 11.5 7.5, 13.5 11.5 L 18.5 21.5 C 20.5 25.5, 24.5 25.5, 24.5 21.5 L 24.5 8.5"
        fill="none" stroke="url(#markStroke)" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bold terminal nodes -->
  <circle cx="7.5" cy="23.5" r="2.7" fill="#5eead4"/>
  <circle cx="24.5" cy="8.5" r="3.0" fill="#f59e0b"/>
</svg>
