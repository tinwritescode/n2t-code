<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" width="1120" height="470" role="img" aria-label="Boring sidebar Recent threads toggle comparing project folders against a flat list sorted by latest send">
  <defs>
    <linearGradient id="panelBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111824"/>
      <stop offset="100%" stop-color="#0d131d"/>
    </linearGradient>
    <linearGradient id="activeRow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#122b2e"/>
      <stop offset="100%" stop-color="#12202c"/>
    </linearGradient>
  </defs>

  <!-- Solid frame -->
  <rect x="1" y="1" width="1118" height="468" rx="16" fill="#0b1017" stroke="#243144" stroke-width="1.5"/>

  <!-- Section header -->
  <text x="32" y="40" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">Recent threads toggle</text>
  <text x="32" y="63" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#94a3b8">In boring-sidebar mode, switch between grouped project folders and one flat list sorted by latest send.</text>

  <!-- LEFT PANE: Project folders -->
  <g transform="translate(32, 86)">
    <rect x="0" y="0" width="452" height="354" rx="12" fill="url(#panelBg)" stroke="#243144" stroke-width="1.2"/>

    <!-- Top status strip -->
    <text x="16" y="25" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">Project folders</text>
    <rect x="312" y="9" width="124" height="22" rx="11" fill="#172030" stroke="#28364c" stroke-width="1"/>
    <text x="374" y="24" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" fill="#94a3b8">aria-pressed=false</text>
    <line x1="0" y1="40" x2="452" y2="40" stroke="#1e2a3b" stroke-width="1"/>

    <!-- Sidebar header controls -->
    <g transform="translate(14, 52)">
      <rect x="0" y="0" width="320" height="32" rx="7" fill="#0b1017" stroke="#233145" stroke-width="1"/>
      <circle cx="15" cy="15" r="5" fill="none" stroke="#64748b" stroke-width="1.6"/>
      <line x1="19" y1="19" x2="22.5" y2="22.5" stroke="#64748b" stroke-width="1.6" stroke-linecap="round"/>
      <text x="31" y="20" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#64748b">Search</text>

      <!-- History / Recent threads button (inactive) -->
      <rect x="328" y="0" width="32" height="32" rx="7" fill="#16202f" stroke="#2a3a52" stroke-width="1"/>
      <path d="M 339 16 A 6 6 0 1 1 341.2 20.6" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M 337 13 L 339 16.5 L 342.5 14.5" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 344.5 12.5 L 344.5 16.2 L 347 17.6" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Scope filter icon -->
      <rect x="366" y="0" width="26" height="32" rx="7" fill="none"/>
      <path d="M 373 12 L 385 12 L 380.5 17.5 L 380.5 22 L 377.5 20.5 L 377.5 17.5 Z" fill="none" stroke="#64748b" stroke-width="1.4" stroke-linejoin="round"/>

      <!-- New thread icon -->
      <rect x="396" y="0" width="28" height="32" rx="7" fill="none"/>
      <rect x="403" y="10" width="13" height="13" rx="2.5" fill="none" stroke="#64748b" stroke-width="1.4"/>
      <path d="M 412 10 L 417 5" stroke="#64748b" stroke-width="1.4" stroke-linecap="round"/>
    </g>

    <!-- Folder 1: n2t-code -->
    <g transform="translate(16, 102)" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="0" y="13" font-size="11.5" font-weight="650" fill="#94a3b8">▾  n2t-code</text>

      <rect x="0" y="22" width="420" height="34" rx="7" fill="#141e2c"/>
      <circle cx="14" cy="39" r="3.5" fill="#2dd4bf"/>
      <text x="27" y="43" font-size="13" font-weight="500" fill="#f1f5f9">Rewrite fork README &amp; SVGs</text>
      <text x="406" y="43" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#5eead4">now</text>

      <rect x="0" y="60" width="420" height="34" rx="7" fill="transparent"/>
      <circle cx="14" cy="77" r="3.5" fill="#64748b"/>
      <text x="27" y="81" font-size="13" fill="#cbd5e1">Fix sidebar scroll reset on toggle</text>
      <text x="406" y="81" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#64748b">19m</text>
    </g>

    <!-- Folder 2: api-gateway -->
    <g transform="translate(16, 208)" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="0" y="13" font-size="11.5" font-weight="650" fill="#94a3b8">▾  api-gateway</text>

      <rect x="0" y="22" width="420" height="34" rx="7" fill="transparent"/>
      <circle cx="14" cy="39" r="3.5" fill="#f59e0b"/>
      <text x="27" y="43" font-size="13" fill="#cbd5e1">Audit rate limiter headers</text>
      <text x="406" y="43" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#94a3b8">4m</text>

      <rect x="0" y="60" width="420" height="34" rx="7" fill="transparent"/>
      <circle cx="14" cy="77" r="3.5" fill="#64748b"/>
      <text x="27" y="81" font-size="13" fill="#94a3b8">Add retry backoff unit tests</text>
      <text x="406" y="81" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#64748b">2h</text>
    </g>

    <!-- Folder 3: mobile-client -->
    <g transform="translate(16, 314)" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="0" y="16" font-size="11.5" font-weight="650" fill="#64748b">▸  mobile-client</text>
      <text x="406" y="16" text-anchor="end" font-size="11.5" fill="#475569">1 active thread · 42m</text>
    </g>
  </g>

  <!-- CENTER TOGGLE CONNECTOR -->
  <g transform="translate(498, 224)">
    <line x1="6" y1="30" x2="114" y2="30" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="5 4"/>
    <path d="M 108 23 L 118 30 L 108 37" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="10" y="-12" width="104" height="26" rx="13" fill="#102a2c" stroke="#2dd4bf" stroke-width="1"/>
    <text x="62" y="5" text-anchor="middle" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#99f6e4">Toggle view</text>
    <text x="62" y="54" text-anchor="middle" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">Flat by send time</text>
  </g>

  <!-- RIGHT PANE: Flat Recent threads -->
  <g transform="translate(636, 86)">
    <rect x="0" y="0" width="452" height="354" rx="12" fill="url(#panelBg)" stroke="#1f5d5b" stroke-width="1.4"/>

    <!-- Top status strip -->
    <text x="16" y="25" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#99f6e4">Recent threads</text>
    <rect x="316" y="9" width="120" height="22" rx="11" fill="#0f2d2e" stroke="#2dd4bf" stroke-width="1"/>
    <text x="376" y="24" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" fill="#5eead4">aria-pressed=true</text>
    <line x1="0" y1="40" x2="452" y2="40" stroke="#1e2a3b" stroke-width="1"/>

    <!-- Sidebar header controls (History active) -->
    <g transform="translate(14, 52)">
      <rect x="0" y="0" width="320" height="32" rx="7" fill="#0b1017" stroke="#233145" stroke-width="1"/>
      <circle cx="15" cy="15" r="5" fill="none" stroke="#64748b" stroke-width="1.6"/>
      <line x1="19" y1="19" x2="22.5" y2="22.5" stroke="#64748b" stroke-width="1.6" stroke-linecap="round"/>
      <text x="31" y="20" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#64748b">Search</text>

      <!-- History / Recent threads button (ACTIVE) -->
      <rect x="328" y="0" width="32" height="32" rx="7" fill="#113636" stroke="#2dd4bf" stroke-width="1.4"/>
      <path d="M 339 16 A 6 6 0 1 1 341.2 20.6" fill="none" stroke="#5eead4" stroke-width="1.7" stroke-linecap="round"/>
      <path d="M 337 13 L 339 16.5 L 342.5 14.5" fill="none" stroke="#5eead4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 344.5 12.5 L 344.5 16.2 L 347 17.6" fill="none" stroke="#5eead4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Scope filter icon -->
      <rect x="366" y="0" width="26" height="32" rx="7" fill="none"/>
      <path d="M 373 12 L 385 12 L 380.5 17.5 L 380.5 22 L 377.5 20.5 L 377.5 17.5 Z" fill="none" stroke="#64748b" stroke-width="1.4" stroke-linejoin="round"/>

      <!-- New thread icon -->
      <rect x="396" y="0" width="28" height="32" rx="7" fill="none"/>
      <rect x="403" y="10" width="13" height="13" rx="2.5" fill="none" stroke="#64748b" stroke-width="1.4"/>
      <path d="M 412 10 L 417 5" stroke="#64748b" stroke-width="1.4" stroke-linecap="round"/>
    </g>

    <!-- Flat chronological list -->
    <g transform="translate(16, 100)" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
      <!-- Row 1 -->
      <rect x="0" y="0" width="420" height="40" rx="8" fill="url(#activeRow)" stroke="#1e4e4f" stroke-width="1"/>
      <circle cx="14" cy="20" r="3.5" fill="#2dd4bf"/>
      <text x="27" y="18" font-size="13" font-weight="600" fill="#f8fafc">Rewrite fork README &amp; SVGs</text>
      <text x="27" y="33" font-size="10.5" fill="#64748b">n2t-code</text>
      <text x="406" y="24" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" fill="#5eead4">now</text>

      <!-- Row 2 -->
      <rect x="0" y="46" width="420" height="40" rx="8" fill="#121a26"/>
      <circle cx="14" cy="66" r="3.5" fill="#f59e0b"/>
      <text x="27" y="64" font-size="13" font-weight="500" fill="#e2e8f0">Audit rate limiter headers</text>
      <text x="27" y="79" font-size="10.5" fill="#64748b">api-gateway</text>
      <text x="406" y="70" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#cbd5e1">4m</text>

      <!-- Row 3 -->
      <rect x="0" y="92" width="420" height="40" rx="8" fill="transparent"/>
      <circle cx="14" cy="112" r="3.5" fill="#64748b"/>
      <text x="27" y="110" font-size="13" fill="#cbd5e1">Fix sidebar scroll reset on toggle</text>
      <text x="27" y="125" font-size="10.5" fill="#64748b">n2t-code</text>
      <text x="406" y="116" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#94a3b8">19m</text>

      <!-- Row 4 -->
      <rect x="0" y="138" width="420" height="40" rx="8" fill="transparent"/>
      <circle cx="14" cy="158" r="3.5" fill="#38bdf8"/>
      <text x="27" y="156" font-size="13" fill="#cbd5e1">Fix iOS keyboard inset</text>
      <text x="27" y="171" font-size="10.5" fill="#64748b">mobile-client</text>
      <text x="406" y="162" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#94a3b8">42m</text>

      <!-- Row 5 -->
      <rect x="0" y="184" width="420" height="40" rx="8" fill="transparent"/>
      <circle cx="14" cy="204" r="3.5" fill="#64748b"/>
      <text x="27" y="202" font-size="13" fill="#94a3b8">Add retry backoff unit tests</text>
      <text x="27" y="217" font-size="10.5" fill="#475569">api-gateway</text>
      <text x="406" y="208" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#64748b">2h</text>
    </g>

    <!-- Footer hint -->
    <line x1="0" y1="326" x2="452" y2="326" stroke="#1e2a3b" stroke-width="1"/>
    <text x="16" y="344" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">Sorted by latest send · persisted per device · clears selection &amp; scrolls to top</text>
  </g>
</svg>
