<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 410" width="1120" height="410" role="img" aria-label="In-app fork updater sidebar progress states and scripts/fork/update.sh pipeline">
  <defs>
    <linearGradient id="stageBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#121a26"/>
      <stop offset="100%" stop-color="#0d131d"/>
    </linearGradient>
  </defs>

  <!-- Solid outer canvas -->
  <rect x="1" y="1" width="1118" height="408" rx="16" fill="#0b1017" stroke="#243144" stroke-width="1.5"/>

  <!-- Section header -->
  <text x="32" y="40" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">In-app fork updater &amp; conflict recovery</text>
  <text x="32" y="63" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#94a3b8">Reads ~/.t3/fork.json to track upstream/main, stream build progress in the sidebar, and hand conflicts to an agent.</text>

  <!-- TOP ROW: 3 sidebar states -->
  <!-- State 1: Check -->
  <g transform="translate(32, 86)" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="0" y="0" width="336" height="114" rx="12" fill="url(#stageBg)" stroke="#243144" stroke-width="1.2"/>
    <text x="16" y="25" font-size="11.5" font-weight="650" fill="#94a3b8">1. SIDEBAR CHECK</text>
    <rect x="16" y="40" width="304" height="40" rx="9" fill="#0f1723" stroke="#253449" stroke-width="1"/>
    <circle cx="33" cy="60" r="5" fill="#38bdf8"/>
    <text x="48" y="64" font-size="13" font-weight="600" fill="#f1f5f9">14 upstream commits</text>
    <rect x="242" y="48" width="68" height="24" rx="6" fill="#172b3d" stroke="#38bdf8" stroke-width="1"/>
    <text x="276" y="64" text-anchor="middle" font-size="11.5" font-weight="600" fill="#bae6fd">Update</text>
    <text x="16" y="99" font-size="11" fill="#64748b">Counts upstream/main commits missing locally</text>
  </g>

  <!-- State 2: Progress ring -->
  <g transform="translate(392, 86)" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="0" y="0" width="336" height="114" rx="12" fill="url(#stageBg)" stroke="#1d5655" stroke-width="1.3"/>
    <text x="16" y="25" font-size="11.5" font-weight="650" fill="#5eead4">2. LIVE BUILD PROGRESS</text>
    <rect x="16" y="40" width="304" height="40" rx="9" fill="#0e1e24" stroke="#1f5858" stroke-width="1"/>
    <!-- Progress ring (45%) -->
    <circle cx="38" cy="60" r="10" fill="none" stroke="#1e3a3f" stroke-width="3"/>
    <circle cx="38" cy="60" r="10" fill="none" stroke="#2dd4bf" stroke-width="3" stroke-dasharray="28.3 62.8" stroke-linecap="round" transform="rotate(-90 38 60)"/>
    <text x="58" y="64" font-size="13" font-weight="600" fill="#f0fdfa">Building desktop app…</text>
    <text x="306" y="64" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" font-weight="700" fill="#5eead4">45%</text>
    <text x="16" y="99" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#64748b">Parsed from "==&gt; [45%] Building …"</text>
  </g>

  <!-- State 3: Conflict agent merge -->
  <g transform="translate(752, 86)" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="0" y="0" width="336" height="114" rx="12" fill="url(#stageBg)" stroke="#5c4218" stroke-width="1.3"/>
    <text x="16" y="25" font-size="11.5" font-weight="650" fill="#fbbf24">3. CONFLICT → AGENT MERGE</text>
    <rect x="16" y="40" width="304" height="40" rx="9" fill="#1f1910" stroke="#785217" stroke-width="1"/>
    <circle cx="33" cy="60" r="5" fill="#f59e0b"/>
    <text x="48" y="64" font-size="13" font-weight="600" fill="#fef3c7">Merge conflict</text>
    <rect x="192" y="48" width="118" height="24" rx="6" fill="#3a280d" stroke="#f59e0b" stroke-width="1"/>
    <text x="251" y="64" text-anchor="middle" font-size="11.5" font-weight="600" fill="#fde68a">Agent merge ▾</text>
    <text x="16" y="99" font-size="11" fill="#94a3b8">Picks model &amp; starts merge thread in checkout</text>
  </g>

  <!-- Conflict arrow from pipeline Step 1 up to Card 3 (clear of label) -->
  <path d="M 248 260 L 248 225 L 920 225 L 920 206" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M 915 211 L 920 203 L 925 211" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="468" y="213" width="232" height="22" rx="11" fill="#1f1910" stroke="#785217" stroke-width="1"/>
  <text x="584" y="228" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" fill="#fbbf24">merge conflict → abort &amp; exit 3</text>

  <!-- BOTTOM ROW: scripts/fork/update.sh pipeline -->
  <text x="32" y="246" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600" fill="#94a3b8">scripts/fork/update.sh --sync</text>

  <!-- Pipeline Step 1 -->
  <g transform="translate(32, 260)" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="0" y="0" width="236" height="118" rx="10" fill="#0f1723" stroke="#243144" stroke-width="1.2"/>
    <rect x="14" y="14" width="54" height="20" rx="5" fill="#142638"/>
    <text x="41" y="28" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="600" fill="#7dd3fc">5–15%</text>
    <text x="14" y="56" font-size="14" font-weight="700" fill="#f8fafc">Sync branches</text>
    <text x="14" y="77" font-size="12" fill="#94a3b8">Merges origin/&lt;branch&gt;</text>
    <text x="14" y="95" font-size="12" fill="#94a3b8">then upstream/main</text>
  </g>

  <!-- Arrow 1->2 -->
  <path d="M 274 319 L 298 319" fill="none" stroke="#475569" stroke-width="1.8"/>
  <path d="M 293 314 L 301 319 L 293 324" fill="none" stroke="#475569" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Pipeline Step 2 -->
  <g transform="translate(306, 260)" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="0" y="0" width="236" height="118" rx="10" fill="#0f1723" stroke="#243144" stroke-width="1.2"/>
    <rect x="14" y="14" width="58" height="20" rx="5" fill="#0f2d2e"/>
    <text x="43" y="28" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="600" fill="#5eead4">25–45%</text>
    <text x="14" y="56" font-size="14" font-weight="700" fill="#f8fafc">Rebuild .app</text>
    <text x="14" y="77" font-size="12" fill="#94a3b8">pnpm install &amp; mac dir target</text>
    <text x="14" y="95" font-size="12" fill="#94a3b8">(skips DMG/zip; pushes origin)</text>
  </g>

  <!-- Arrow 2->3 -->
  <path d="M 548 319 L 572 319" fill="none" stroke="#475569" stroke-width="1.8"/>
  <path d="M 567 314 L 575 319 L 567 324" fill="none" stroke="#475569" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Pipeline Step 3 -->
  <g transform="translate(580, 260)" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="0" y="0" width="236" height="118" rx="10" fill="#0f1723" stroke="#243144" stroke-width="1.2"/>
    <rect x="14" y="14" width="66" height="20" rx="5" fill="#182232"/>
    <text x="47" y="28" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="600" fill="#cbd5e1">BACKUP</text>
    <text x="14" y="56" font-size="14" font-weight="700" fill="#f8fafc">Snapshot &amp; register</text>
    <text x="14" y="77" font-size="12" fill="#94a3b8">Backs up app &amp; statev2.sqlite*</text>
    <text x="14" y="95" font-size="12" fill="#94a3b8">Writes ~/.t3/fork.json</text>
  </g>

  <!-- Arrow 3->4 -->
  <path d="M 822 319 L 846 319" fill="none" stroke="#475569" stroke-width="1.8"/>
  <path d="M 841 314 L 849 319 L 841 324" fill="none" stroke="#475569" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Pipeline Step 4 -->
  <g transform="translate(854, 260)" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="0" y="0" width="234" height="118" rx="10" fill="#0e1e24" stroke="#1f5858" stroke-width="1.2"/>
    <rect x="14" y="14" width="76" height="20" rx="5" fill="#113636"/>
    <text x="52" y="28" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="600" fill="#5eead4">INSTALL</text>
    <text x="14" y="56" font-size="14" font-weight="700" fill="#f0fdfa">Swap &amp; relaunch</text>
    <text x="14" y="77" font-size="12" fill="#99f6e4">Detached session quits app,</text>
    <text x="14" y="95" font-size="12" fill="#99f6e4">updates /Applications &amp; opens</text>
  </g>
</svg>
